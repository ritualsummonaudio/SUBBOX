name: ONYX U1 native Windows verification
'on':
  push:
    branches:
    - update/onyx-u1-permanent-bands
    paths:
    - .github/workflows/onyx-u1-native.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Confirm the previously tested DSP source is unchanged
      shell: python
      run: |-
        import subprocess
        paths=['baseline','update/BandRanges.h','update/hooks.cpp','update/hooks.S','update/guard-stubs.S','update/targets.cpp','update/exports.def','update/build_patch.py']
        subprocess.run(['git','diff','--exit-code','b45ad3b0302d0a78cfcd3ec7605482d421bce630','HEAD','--',*paths],check=True)
        print('DSP source matches the existing 489-case tested image; only verification/build files may differ.')
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: onyx-u1-tested-image
        path: update
        run-id: 43705778177
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Retain Linux evidence for this exact image
      shell: python
      run: |
        from pathlib import Path
        import shutil
        for path in Path('update').rglob('*.json'):
            target=Path('qa/linux')/path.relative_to('update')
            target.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(path,target)
    - name: Retrieve the 234 completed native Windows checks
      uses: actions/download-artifact@v4
      with:
        name: onyx-u1-windows-evidence
        path: prior-results
        run-id: 43709407124
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify and retain the completed native Windows results
      shell: python
      run: |
        from pathlib import Path
        import hashlib,json,shutil
        root=Path('update');digest=hashlib.sha256((root/'Candidate.vst3').read_bytes()).hexdigest()
        names=['Scope-Proof.json','band-proof/Results.json','update-proof/Results.json'];count=0
        for name in names:
            source=Path('prior-results')/name
            report=json.loads(source.read_text())
            assert report['module_sha256']==digest and report['failures']==0
            count+=report['case_count']
            for parent in [root,Path('qa/windows-prior')]:
                target=parent/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,target)
        assert count==234
        Path('qa/windows-prior/PROVENANCE.json').write_text(json.dumps(dict(module_sha256=digest,source_run=43709407124,native_windows_completed_cases=count,source_reports=names),indent=2)+'\n')
        print('Retained 234 passing Windows cases for the identical VST3 image.',flush=True)
    - name: Configure the native Windows toolchain
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (!$install) { throw 'Visual C++ toolchain not found' }
        $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
        $command = '"' + $devcmd + '" -arch=x64 -host_arch=x64 >nul && set'
        cmd /c $command | ForEach-Object {
          if ($_ -match '^(INCLUDE|LIB|LIBPATH|Path|PATH|VCToolsInstallDir|WindowsSdkDir|UniversalCRTSdkDir)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value $_ }
        }
        if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\chocolatey\bin'
        }
    - name: Install measurement dependencies and native probes
      run: |
        python -m pip install -r requirements.txt
        python tools/build.py --probes-only
    - name: Native loader and first signal case preflight
      shell: python
      run: |
        from pathlib import Path
        import os,subprocess
        root=Path('update').resolve()
        env=dict(os.environ,SBO_EXPECT_DELAY='384',SBO_ENGINE_FINAL_GUARD='1',SBO_TEST_POST_METER='1',SBO_DISCARD_UNAVAILABLE='1')
        cmd=[str(root/'engine-probe.exe'),str(root/'Candidate.vst3'),'40','0','0','0','0','.00001','.8',os.devnull,'48000']
        print('Starting native Windows DLL and 40 Hz signal preflight',flush=True)
        try:
            result=subprocess.run(cmd,env=env,capture_output=True,text=True,timeout=20)
        except subprocess.TimeoutExpired as error:
            print('Native preflight timed out',flush=True)
            print(error.stdout,flush=True)
            print(error.stderr,flush=True)
            raise
        print(result.stdout,flush=True)
        print(result.stderr,flush=True)
        assert result.returncode==0,result.returncode
    - name: Complete native peak and periodic checks with the longer offline timeout
      shell: python
      run: |
        from pathlib import Path
        import hashlib,json,subprocess,sys
        assert sys.platform=='win32'
        root=Path('.').resolve();work=root/'update';digest=hashlib.sha256((work/'Candidate.vst3').read_bytes()).hexdigest()
        for name in ['verify_guard.py','verify_periodic.py']:
            subprocess.run([sys.executable,str(work/name)],check=True)
        names=['Scope-Proof.json','band-proof/Results.json','update-proof/Results.json','guard-proof-U1/Results.json','periodic-proof/Results.json']
        reports=[json.loads((work/name).read_text()) for name in names]
        assert all(report['module_sha256']==digest and report['failures']==0 for report in reports)
        summary=dict(module_sha256=digest,groups=len(reports),cases=sum(report['case_count'] for report in reports),failures=0,platform=sys.platform,reports=['update/'+name for name in names],native_VST3_DLL_loaded=True,full_VST3_host_editor=False,FL_Studio=False,owner_seal_required=True,retained_native_windows_run=43709407124,retained_native_windows_cases=234,new_native_windows_cases=255)
        assert summary['cases']==489
        (work/'Verification-Summary.json').write_text(json.dumps(summary,indent=2)+'\n')
        print(json.dumps(summary,indent=2),flush=True)
    - name: Package tested development image, complete source and evidence
      run: python tools/package.py
    - uses: actions/upload-artifact@v4
      with:
        name: SUB-BOX-ONYX-U1-Owner-Development
        path: handoff/SUB-BOX-ONYX-U1-Owner-Development.zip
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: onyx-u1-windows-evidence
        path: |
          update/Patch-Identity.json
          update/Scope-Proof.json
          update/Verification-Summary.json
          update/band-proof/Results.json
          update/update-proof/Results.json
          update/guard-proof-U1/Results.json
          update/periodic-proof/Results.json
    env:
      PYTHONUNBUFFERED: '1'
